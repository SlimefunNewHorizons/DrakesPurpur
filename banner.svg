<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="920" height="240" role="img" aria-label="DrakesPurpur Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#120e26" />
      <stop offset="100%" stop-color="#0a192f" />
    </linearGradient>
    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cyberPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .pulse-glow {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    .grid-line {
      stroke: #38bdf8;
      stroke-opacity: 0.08;
      stroke-width: 1;
    }
    .tech-text {
      font-family: 'JetBrains Mono', 'Fira Code', 'Segoe UI', monospace;
      font-weight: 800;
    }
    @keyframes pulse {
      0% { opacity: 0.4; }
      100% { opacity: 0.9; }
    }
  </style>

  <!-- Background Canvas -->
  <rect width="920" height="240" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Cyber Grid Lines -->
  <line x1="40" y1="40" x2="880" y2="40" class="grid-line" />
  <line x1="40" y1="120" x2="880" y2="120" class="grid-line" />
  <line x1="40" y1="200" x2="880" y2="200" class="grid-line" />
  <line x1="160" y1="20" x2="160" y2="220" class="grid-line" />
  <line x1="460" y1="20" x2="460" y2="220" class="grid-line" />
  <line x1="760" y1="20" x2="760" y2="220" class="grid-line" />

  <!-- Glowing Emblem / Sigil -->
  <g transform="translate(60, 48)">
    <polygon points="40,0 80,24 80,72 40,96 0,72 0,24" fill="#1e1b4b" stroke="url(#cyberPurple)" stroke-width="3" filter="url(#glow)"/>
    <polygon points="40,12 68,28 68,68 40,84 12,68 12,28" fill="#0f172a" stroke="url(#accentGold)" stroke-width="2" class="pulse-glow"/>
    <text x="40" y="58" text-anchor="middle" fill="#fbbf24" font-size="28" font-family="'Segoe UI', sans-serif" font-weight="900">⚡</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="180" y="86" fill="url(#accentGold)" class="tech-text" font-size="44" letter-spacing="1.5">DRAKES<tspan fill="#f8fafc">PURPUR</tspan></text>
  <text x="560" y="86" fill="url(#neonCyan)" class="tech-text" font-size="24">26.2</text>

  <text x="180" y="122" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">
    Motor de Alto Rendimiento Minecraft · Rust FFM Kernel · Geyser Bedrock Bridge · SAORI SRE
  </text>

  <!-- Tags / Pills -->
  <g transform="translate(180, 150)">
    <!-- Pill 1: Rust FFM -->
    <rect x="0" y="0" width="130" height="32" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="65" y="21" fill="#c7d2fe" font-size="12" font-family="sans-serif" font-weight="700" text-anchor="middle">🦀 RUST FFM CORE</text>

    <!-- Pill 2: Slimefun Opt -->
    <rect x="142" y="0" width="150" height="32" rx="8" fill="#142820" stroke="#10b981" stroke-width="1.5"/>
    <text x="217" y="21" fill="#a7f3d0" font-size="12" font-family="sans-serif" font-weight="700" text-anchor="middle">⚡ SLIMEFUN NATIVE</text>

    <!-- Pill 3: Geyser Bridge -->
    <rect x="304" y="0" width="150" height="32" rx="8" fill="#0c2a42" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="379" y="21" fill="#bae6fd" font-size="12" font-family="sans-serif" font-weight="700" text-anchor="middle">📱 GEYSER BEDROCK</text>

    <!-- Pill 4: Crash Guard -->
    <rect x="466" y="0" width="150" height="32" rx="8" fill="#3b1126" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="541" y="21" fill="#fecdd3" font-size="12" font-family="sans-serif" font-weight="700" text-anchor="middle">🛡️ CRASH GUARD WAL</text>
  </g>

  <!-- Footer Tagline -->
  <text x="880" y="220" text-anchor="end" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">
    DRAKESセカンドシーズン · SOVEREIGN ARCHITECTURE
  </text>
</svg>
