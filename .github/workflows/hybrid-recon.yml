name: Hybrid recon (EXPERIMENTAL)
on:
  workflow_dispatch:
  push:
    branches: ["experimental/horizon-rust-hybrid-engine"]
    paths: [".github/workflows/hybrid-recon.yml"]
jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 25, cache: gradle }
      - uses: gradle/actions/setup-gradle@v6
      - run: git config --global user.email "no-reply@github.com" && git config --global user.name "Github Actions"
      - run: ./gradlew applyAllPatches --stacktrace
      - name: Dump
        run: |
          S=$(find . -path '*/net/minecraft/util/SimpleBitStorage.java' | head -1)
          R=${S%/net/minecraft/util/SimpleBitStorage.java}; L=$R/net/minecraft/world/level/levelgen
          strip() { sed -e 's#//.*$##' -e '/^\s*$/d' -e '/^import /d' "$1"; }
          echo "=====NormalNoise"; strip $L/synth/NormalNoise.java
          echo "=====PerlinNoise"; strip $L/synth/PerlinNoise.java
          echo "=====SimplexNoise.dot/GRADIENT"; strip $L/synth/SimplexNoise.java | sed -n 1,40p
          M=$R/net/minecraft/util/Mth.java
          echo "=====Mth"; grep -n -A6 "static double smoothstep(\|static double lerp3(\|static double lerp(final double\|static long lfloor\|static int floor(final double\|static double lerp2(" $M | cut -c1-200
          echo "=====END"
