name: Hybrid recon (EXPERIMENTAL)
on:
  workflow_dispatch:
  push:
    branches: ["experimental/horizon-rust-hybrid-engine"]
    paths: [".github/workflows/hybrid-recon.yml"]
jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 25, cache: gradle }
      - uses: gradle/actions/setup-gradle@v6
      - run: git config --global user.email "no-reply@github.com" && git config --global user.name "Github Actions"
      - run: ./gradlew applyAllPatches --stacktrace
      - name: Dump sources
        run: |
          S=$(find . -path '*/net/minecraft/util/SimpleBitStorage.java' | head -1)
          R=${S%/net/minecraft/util/SimpleBitStorage.java}
          C=$R/net/minecraft/world/level/chunk
          echo "=====FACTORY"; cat $C/PalettedContainerFactory.java
          echo "=====STRATEGY"; grep -n "Strategy" $C/PalettedContainer.java | head -20
          echo "=====PCRO"; grep -n "pack\|Codec\|PackedData" $C/PalettedContainerRO.java | head -20
          echo "=====USAGE"; grep -rn "PalettedContainerFactory" $R/net/minecraft --include=*.java | grep -v "^$C/PalettedContainerFactory.java" | grep -v import | head -25
          echo "=====SECTION codec"; grep -n "Codec\|containerFactory\|factory" $R/net/minecraft/world/level/chunk/storage/SerializableChunkData.java | head -25
          echo "=====SEND"; grep -rn "class ClientboundLevelChunkWithLightPacket" $R | head -2; grep -n "ClientboundLevelChunkWithLightPacket\|markChunkPendingToSend\|sendChunk" $R/net/minecraft/server/level/ChunkMap.java $R/net/minecraft/server/network/PlayerChunkSender.java | head -20
          echo "=====EVENTS"; ls $R/../../../../paper-api/src/main/java/io/papermc/paper/event/packet 2>/dev/null | head; find . -name 'PlayerChunkLoadEvent.java' | head -2
          echo "=====END"
