name: Hybrid recon (EXPERIMENTAL)
on:
  workflow_dispatch:
  push:
    branches: ["experimental/horizon-rust-hybrid-engine"]
    paths: [".github/workflows/hybrid-recon.yml"]
jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 25, cache: gradle }
      - uses: gradle/actions/setup-gradle@v6
      - run: git config --global user.email "no-reply@github.com" && git config --global user.name "Github Actions"
      - run: ./gradlew applyAllPatches --stacktrace
      - name: Dump sources
        run: |
          S=$(find . -path '*/net/minecraft/util/SimpleBitStorage.java' | head -1)
          ROOT=${S%/net/minecraft/util/SimpleBitStorage.java}
          echo "=====SBS"; sed -n 1,360p $S
          echo "=====LCS"; grep -n "PalettedContainer\|write(\|read(" $ROOT/net/minecraft/world/level/chunk/LevelChunkSection.java | head -30
          echo "=====SCD"; grep -n "pack(\|PackedData\|unpack(" $ROOT/net/minecraft/world/level/chunk/storage/SerializableChunkData.java | head -30
          echo "=====END"
