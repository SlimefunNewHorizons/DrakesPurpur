name: Hybrid compat Slimefun + StarSuites (EXPERIMENTAL)
on:
  workflow_dispatch:
  push:
    branches: ["experimental/horizon-rust-hybrid-engine"]
    paths: ["tools/compat-smoke/**", ".github/workflows/hybrid-compat.yml"]
jobs:
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 25, cache: gradle }
      - uses: gradle/actions/setup-gradle@v6
      - run: git config --global user.email "no-reply@github.com" && git config --global user.name "Github Actions"
      - name: Build DrakesPurpur Hybrid jar + native lib
        run: |
          ./gradlew applyAllPatches --stacktrace
          ./gradlew createPaperclipJar --stacktrace
          (cd native/drakes-hybrid && cargo build --release)
          mkdir -p native-lib && cp native/drakes-hybrid/target/release/libdrakes_hybrid_ffi.so native-lib/
          mkdir -p run && cp purpur-server/build/libs/*paperclip*.jar run/server.jar
      - name: Checkout Slimefun4-Drake (read-only)
        uses: actions/checkout@v7
        with: { repository: SlimefunNewHorizons/Slimefun4-Drake, ref: port-26x, path: ext/slimefun }
      - name: Checkout Drakes-Suites (read-only)
        uses: actions/checkout@v7
        with: { repository: SlimefunNewHorizons/Drakes-Suites, ref: 26.x, path: ext/suites }
      - name: Checkout Slimefun-Knowledge-Drake (volcado de produccion, solo lectura)
        uses: actions/checkout@v7
        with: { repository: JackStar6677-1/Slimefun-Knowledge-Drake, path: ext/knowledge }
      - name: Build Slimefun
        id: bsf
        continue-on-error: true
        run: cd ext/slimefun && mvn -B -ntp -DskipTests -Dmaven.test.skip=true package 2>&1 | tail -60 | tee ../../build-slimefun.txt; test ${PIPESTATUS[0]} -eq 0
      - name: Build StarSuites
        id: bss
        continue-on-error: true
        run: cd ext/suites && mvn -B -ntp -DskipTests -Dmaven.test.skip=true --fail-at-end package 2>&1 | tail -60 | tee ../../build-suites.txt; test ${PIPESTATUS[0]} -eq 0
      - name: Resultado de builds
        run: |
          echo "slimefun build: ${{ steps.bsf.outcome }}   suites build: ${{ steps.bss.outcome }}"
          ls ext/slimefun/target/*.jar ext/suites/*/target/*.jar 2>&1 | head -20
          grep -E "ERROR|Could not|BUILD" build-slimefun.txt build-suites.txt | cut -c1-220 | head -25
      - name: Boot 1 (Hybrid ON) with Slimefun/Suites + smoke plugin
        if: steps.bsf.outcome == 'success'
        run: |
          cd run && echo "eula=true" > eula.txt
          printf 'online-mode=false\nserver-port=25598\nlevel-seed=12345\nview-distance=4\nsimulation-distance=4\nspawn-protection=0\n' > server.properties
          mkdir -p plugins drakes-data && printf 'native:\n  hybrid:\n    enabled: true\n    bits: true\n' > drakes-data/perf.yml
          cp ../ext/slimefun/target/*.jar plugins/ 2>/dev/null; ls ../ext/slimefun/target/*.jar
          for j in ../ext/suites/*/target/*.jar; do case "$j" in *sources*|*original-*|*javadoc*) ;; *onechunk*) mkdir -p plugins/BentoBox/addons && cp "$j" plugins/BentoBox/addons/ ;; *) cp "$j" plugins/ ;; esac; done
          rm -f plugins/*sources*.jar plugins/original-*.jar; ls plugins
          # primer arranque solo para extraer el servidor parcheado (cache/patched_*.jar)
          (timeout 600 java -Xmx2G -Ddrakes.native.dir=$GITHUB_WORKSPACE/native-lib --enable-native-access=ALL-UNNAMED -jar server.jar --nogui < /dev/null > ../boot0.log 2>&1 &) ; sleep 150; pkill -f server.jar || true; sleep 3
          CP=$(find cache libraries -name '*.jar' | tr '\n' ':')$(ls plugins/*.jar | tr '\n' ':')
          echo "classpath jars: $(echo $CP | tr ':' '\n' | wc -l)"
          echo "== plugins/"; ls -la plugins | awk '{print $5, $9}' | head -40
          for j in plugins/*.jar; do echo "$j: SlimefunItem.class=$(unzip -l "$j" | grep -c 'SlimefunItem.class') BlockStorage.class=$(unzip -l "$j" | grep -c 'BlockStorage.class')"; done
          unzip -l plugins/$(ls plugins | grep -i slimefun | head -1) | grep -E "/SlimefunItem.class|/BlockStorage.class|/Slimefun.class" | head -5
          mkdir -p ../smoke-out && (javac -proc:none -Xmaxerrs 8 -cp "$CP" -d ../smoke-out ../tools/compat-smoke/src/HybridCompatSmoke.java 2>&1 | head -30)
          cp ../tools/compat-smoke/plugin.yml ../smoke-out/ && (cd ../smoke-out && jar cf ../run/plugins/HybridCompatSmoke.jar .)
      - name: Esperado desde Slimefun-Knowledge-Drake
        run: |
          python3 - <<'PY'
          import gzip, json, collections
          d = json.load(gzip.open('ext/knowledge/data/slimefun-dump.json.gz'))
          c = collections.Counter(i.get('addon') for i in d['items'])
          with open('expected.properties', 'w') as f:
              f.write('__items=%d\n__groups=%d\n__researches=%d\n' % (len(d['items']), len(d['groups']), len(d['researches'])))
              for k, v in c.items():
                  f.write('%s=%d\n' % (str(k).replace(' ', '\\ ').replace(':', '\\:').replace('=', '\\='), v))
          print('esperado:', len(d['items']), 'items,', len(c), 'addons,', len(d['groups']), 'grupos,', len(d['researches']), 'investigaciones; generado', d['generated_at'], d['server'], d['slimefun'])
          PY
      - name: Smoke fase 1
        if: steps.bsf.outcome == 'success'
        run: |
          cd run; set +e
          timeout 420 java -Xmx2G -Dsmoke.phase=1 -Dcatalog.expected=$GITHUB_WORKSPACE/expected.properties -Ddrakes.native.dir=$GITHUB_WORKSPACE/native-lib --enable-native-access=ALL-UNNAMED -jar server.jar --nogui < /dev/null > ../smoke1.log 2>&1
          echo "exit=$?"
          echo "== resultado fase 1: PASS=$(grep -c ^PASS compat-smoke-phase1.txt) FAIL=$(grep -c ^FAIL compat-smoke-phase1.txt)"; grep -v -E "^PASS (getById|getByItem)|^plugin " compat-smoke-phase1.txt | head -40
          echo "== log servidor fase 1"
          grep -E "Enabling|Disabling|Done \(|HybridNative|SEVERE|ERROR" ../smoke1.log | cut -c1-170 | head -40
          tail -12 ../smoke1.log | cut -c1-170
          echo "== catalogo"; cp compat-catalog.json compat-catalog.md .. 2>/dev/null; grep -E "^catalog:" compat-smoke-phase1.txt; head -22 compat-catalog.md | cut -c1-160
          python3 -c "import json;d=json.load(open('compat-catalog.json'));print('ausentes:',len(d['expected_addons_missing']),d['expected_addons_missing'][:12]);print('parciales:',d['expected_addons_partial'][:8]);print('no esperados:',d['found_addons_not_in_expected'][:8])"
      - name: Smoke fase 2 (persistencia tras reinicio)
        if: steps.bsf.outcome == 'success'
        run: |
          cd run; set +e
          timeout 420 java -Xmx2G -Dsmoke.phase=2 -Ddrakes.native.dir=$GITHUB_WORKSPACE/native-lib --enable-native-access=ALL-UNNAMED -jar server.jar --nogui < /dev/null > ../smoke2.log 2>&1
          echo "exit=$?"
          echo "== resultado fase 2: PASS=$(grep -c ^PASS compat-smoke-phase2.txt) FAIL=$(grep -c ^FAIL compat-smoke-phase2.txt)"; grep -v -E "^PASS (getById|getByItem)|^plugin " compat-smoke-phase2.txt | head -40
          echo "== log servidor fase 2"
          grep -E "Enabling|Disabling|Done \(|HybridNative|SEVERE|ERROR" ../smoke2.log | cut -c1-170 | head -40
          tail -12 ../smoke2.log | cut -c1-170
      - name: Diagnostico compilacion del plugin de prueba
        if: always()
        run: |
          cd run
          unzip -l ../smoke-out.jar 2>/dev/null | tail -3 || true
          echo "== contenido jar smoke:"; unzip -l plugins/HybridCompatSmoke.jar | tail -6
          echo "== clases Slimefun en jars:"; for j in plugins/*lime*.jar plugins/*Slime*.jar; do [ -f "$j" ] && unzip -l "$j" | grep -E "/SlimefunItem.class|/BlockStorage.class|implementation/Slimefun.class" | head -4; done
          CP=$(find cache libraries -name '*.jar' | tr '\n' ':')$(ls plugins/*.jar | tr '\n' ':')
          echo "== javac:"; mkdir -p /tmp/sm && javac -proc:none -Xmaxerrs 6 -cp "$CP" -d /tmp/sm ../tools/compat-smoke/src/HybridCompatSmoke.java 2>&1 | head -24; echo "javac exit=${PIPESTATUS[0]}"
      - name: Resumen del catalogo real
        if: always()
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('run/compat-catalog.json'))
          print('TOTALES encontrados:', json.dumps(d['totals']))
          print('TOTALES esperados  :', json.dumps(d['expected_totals']))
          print('items por addon    :', json.dumps(d['items_by_addon']))
          print('ausentes (%d)      :' % len(d['expected_addons_missing']), '; '.join(d['expected_addons_missing'][:70]))
          print('parciales          :', d['expected_addons_partial'])
          print('no esperados       :', d['found_addons_not_in_expected'])
          print('plugins            :', ', '.join(d['plugins']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: hybrid-compat-catalog, path: "run/compat-catalog.json\nrun/compat-catalog.md\nexpected.properties\nsmoke1.log\nsmoke2.log" }
      - name: Errores en logs
        if: always()
        run: grep -h -E "ERROR|SEVERE|Exception" smoke1.log smoke2.log 2>/dev/null | cut -c1-200 | sort | uniq -c | sort -rn | head -15

  monolith:
    name: Monolito (StarSuites embebidas en el JAR) + Hybrid ON
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 25, cache: gradle }
      - uses: gradle/actions/setup-gradle@v6
      - run: git config --global user.email "no-reply@github.com" && git config --global user.name "Github Actions"
      - uses: actions/checkout@v7
        with: { repository: SlimefunNewHorizons/Slimefun4-Drake, ref: port-26x, path: ext/slimefun }
      - uses: actions/checkout@v7
        with: { repository: SlimefunNewHorizons/Drakes-Suites, ref: 26.x, path: ext/suites }
      - name: Build Slimefun + StarSuites
        run: |
          (cd ext/slimefun && mvn -B -ntp -q -DskipTests -Dmaven.test.skip=true package) 2>&1 | tail -5
          (cd ext/suites && mvn -B -ntp -q -DskipTests -Dmaven.test.skip=true --fail-at-end package) 2>&1 | tail -5
          ls ext/suites/*/target/*.jar | head -20
      - name: Embeber suites en el JAR (monolito) y construir
        run: |
          ./gradlew applyAllPatches --stacktrace
          scripts/empaquetar_monolito.sh ext/suites
          scripts/empaquetar_nativos.sh
          DRAKES_BUNDLE=1 BUILD_NUMBER=134 ./gradlew createPaperclipJar --stacktrace
          mkdir -p run/plugins run/drakes-data
          cp purpur-server/build/libs/*paperclip*.jar run/server.jar
          sha256sum run/server.jar | tee monolith-sha256.txt
          echo "entradas empaquetadas en el JAR (suites .jar + nativos): $(unzip -l run/server.jar | grep -cE 'bundled/|drakes-natives/')"; unzip -l run/server.jar | grep -E 'drakes-natives' | head -4
      - name: Preparar servidor (solo Slimefun en plugins/; las suites salen del JAR)
        run: |
          cd run && echo "eula=true" > eula.txt
          printf 'online-mode=false\nserver-port=25597\nlevel-seed=12345\nview-distance=4\nsimulation-distance=4\nspawn-protection=0\n' > server.properties
          printf 'native:\n  hybrid:\n    enabled: true\n    bits: true\n' > drakes-data/perf.yml
          cp ../ext/slimefun/target/*.jar plugins/; rm -f plugins/*sources*.jar plugins/original-*.jar
          (timeout 600 java -Xmx2G --enable-native-access=ALL-UNNAMED -jar server.jar --nogui < /dev/null > ../boot0.log 2>&1 &) ; sleep 150; pkill -f server.jar || true; sleep 3
          echo "== plugins/ tras el primer arranque (suites extraidas del JAR):"; ls plugins | head -30; cat drakes-data/bundled-state.yml 2>/dev/null | head -14
          CP=$(find cache libraries -name '*.jar' | tr '\n' ':')$(ls plugins/*.jar | tr '\n' ':')
          mkdir -p ../smoke-out && javac -proc:none -Xmaxerrs 8 -cp "$CP" -d ../smoke-out ../tools/compat-smoke/src/HybridCompatSmoke.java 2>&1 | head -10
          cp ../tools/compat-smoke/plugin.yml ../smoke-out/ && (cd ../smoke-out && jar cf ../run/plugins/HybridCompatSmoke.jar .)
      - name: Smoke monolito (fase 1 y 2)
        run: |
          cd run; set +e
          for ph in 1 2; do
            timeout 420 java -Xmx2G -Dsmoke.phase=$ph --enable-native-access=ALL-UNNAMED -jar server.jar --nogui < /dev/null > ../mono$ph.log 2>&1
            echo "== fase $ph exit=$? PASS=$(grep -c ^PASS compat-smoke-phase$ph.txt) FAIL=$(grep -c ^FAIL compat-smoke-phase$ph.txt)"; grep -v -E "^PASS (getById|getByItem)|^plugin " compat-smoke-phase$ph.txt | head -12
            grep -E "Enabling|DrakesBundled|Done \(|HybridNative|SEVERE|ERROR" ../mono$ph.log | cut -c1-150 | head -26
            echo "-- origen de la biblioteca nativa (ruta completa, sin -Ddrakes.native.dir):"; grep -ho "lib=[^ ]*" ../mono$ph.log | head -2; ls -la drakes-data/natives/*/ 2>/dev/null | head -5
          done
