name: Hybrid compat Slimefun + StarSuites (EXPERIMENTAL)
on:
  workflow_dispatch:
  push:
    branches: ["experimental/horizon-rust-hybrid-engine"]
    paths: ["tools/compat-smoke/**", ".github/workflows/hybrid-compat.yml"]
jobs:
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 25, cache: gradle }
      - uses: gradle/actions/setup-gradle@v6
      - run: git config --global user.email "no-reply@github.com" && git config --global user.name "Github Actions"
      - name: Build DrakesPurpur Hybrid jar + native lib
        run: |
          ./gradlew applyAllPatches --stacktrace
          ./gradlew createPaperclipJar --stacktrace
          (cd native/drakes-hybrid && cargo build --release)
          mkdir -p native-lib && cp native/drakes-hybrid/target/release/libdrakes_hybrid_ffi.so native-lib/
          mkdir -p run && cp purpur-server/build/libs/*paperclip*.jar run/server.jar
      - name: Checkout Slimefun4-Drake (read-only)
        uses: actions/checkout@v7
        with: { repository: SlimefunNewHorizons/Slimefun4-Drake, ref: port-26x, path: ext/slimefun }
      - name: Checkout Drakes-Suites (read-only)
        uses: actions/checkout@v7
        with: { repository: SlimefunNewHorizons/Drakes-Suites, ref: 26.x, path: ext/suites }
      - name: Build Slimefun
        id: bsf
        continue-on-error: true
        run: cd ext/slimefun && mvn -B -ntp -DskipTests -Dmaven.test.skip=true package 2>&1 | tail -60 | tee ../../build-slimefun.txt; test ${PIPESTATUS[0]} -eq 0
      - name: Build StarSuites
        id: bss
        continue-on-error: true
        run: cd ext/suites && mvn -B -ntp -DskipTests -Dmaven.test.skip=true --fail-at-end package 2>&1 | tail -60 | tee ../../build-suites.txt; test ${PIPESTATUS[0]} -eq 0
      - name: Resultado de builds
        run: |
          echo "slimefun build: ${{ steps.bsf.outcome }}   suites build: ${{ steps.bss.outcome }}"
          ls ext/slimefun/target/*.jar ext/suites/*/target/*.jar 2>&1 | head -20
          grep -E "ERROR|Could not|BUILD" build-slimefun.txt build-suites.txt | cut -c1-220 | head -25
      - name: Boot 1 (Hybrid ON) with Slimefun/Suites + smoke plugin
        if: steps.bsf.outcome == 'success'
        run: |
          cd run && echo "eula=true" > eula.txt
          printf 'online-mode=false\nserver-port=25598\nlevel-seed=12345\nview-distance=4\nsimulation-distance=4\nspawn-protection=0\n' > server.properties
          mkdir -p plugins drakes-data && printf 'native:\n  hybrid:\n    enabled: true\n    bits: true\n' > drakes-data/perf.yml
          cp ../ext/slimefun/target/*.jar plugins/ 2>/dev/null; ls ../ext/slimefun/target/*.jar
          for j in ../ext/suites/*/target/*.jar; do case "$j" in *sources*|*original-*|*javadoc*) ;; *) cp "$j" plugins/ ;; esac; done
          rm -f plugins/*sources*.jar plugins/original-*.jar; ls plugins
          # primer arranque solo para extraer el servidor parcheado (cache/patched_*.jar)
          (timeout 600 java -Xmx2G -Ddrakes.native.dir=$GITHUB_WORKSPACE/native-lib --enable-native-access=ALL-UNNAMED -jar server.jar --nogui < /dev/null > ../boot0.log 2>&1 &) ; sleep 150; pkill -f server.jar || true; sleep 3
          CP=$(find cache libraries -name '*.jar' | tr '\n' ':')$(ls plugins/*.jar | tr '\n' ':')
          echo "classpath jars: $(echo $CP | tr ':' '\n' | wc -l)"
          echo "== plugins/"; ls -la plugins | awk '{print $5, $9}' | head -40
          for j in plugins/*.jar; do echo "$j: SlimefunItem.class=$(unzip -l "$j" | grep -c 'SlimefunItem.class') BlockStorage.class=$(unzip -l "$j" | grep -c 'BlockStorage.class')"; done
          unzip -l plugins/$(ls plugins | grep -i slimefun | head -1) | grep -E "/SlimefunItem.class|/BlockStorage.class|/Slimefun.class" | head -5
          mkdir -p ../smoke-out && (javac -proc:none -Xmaxerrs 8 -cp "$CP" -d ../smoke-out ../tools/compat-smoke/src/HybridCompatSmoke.java 2>&1 | head -30)
          cp ../tools/compat-smoke/plugin.yml ../smoke-out/ && (cd ../smoke-out && jar cf ../run/plugins/HybridCompatSmoke.jar .)
      - name: Smoke fase 1
        if: steps.bsf.outcome == 'success'
        run: |
          cd run; set +e
          timeout 420 java -Xmx2G -Dsmoke.phase=1 -Ddrakes.native.dir=$GITHUB_WORKSPACE/native-lib --enable-native-access=ALL-UNNAMED -jar server.jar --nogui < /dev/null > ../smoke1.log 2>&1
          echo "exit=$?"
          echo "== resultado fase 1"; head -45 compat-smoke-phase1.txt 2>&1
          echo "== log servidor fase 1"
          grep -E "Enabling|Disabling|Done \(|HybridNative|SEVERE|ERROR" ../smoke1.log | cut -c1-170 | head -40
          tail -12 ../smoke1.log | cut -c1-170
      - name: Smoke fase 2 (persistencia tras reinicio)
        if: steps.bsf.outcome == 'success'
        run: |
          cd run; set +e
          timeout 420 java -Xmx2G -Dsmoke.phase=2 -Ddrakes.native.dir=$GITHUB_WORKSPACE/native-lib --enable-native-access=ALL-UNNAMED -jar server.jar --nogui < /dev/null > ../smoke2.log 2>&1
          echo "exit=$?"
          echo "== resultado fase 2"; head -45 compat-smoke-phase2.txt 2>&1
          echo "== log servidor fase 2"
          grep -E "Enabling|Disabling|Done \(|HybridNative|SEVERE|ERROR" ../smoke2.log | cut -c1-170 | head -40
          tail -12 ../smoke2.log | cut -c1-170
      - name: Diagnostico compilacion del plugin de prueba
        if: always()
        run: |
          cd run
          unzip -l ../smoke-out.jar 2>/dev/null | tail -3 || true
          echo "== contenido jar smoke:"; unzip -l plugins/HybridCompatSmoke.jar | tail -6
          echo "== clases Slimefun en jars:"; for j in plugins/*lime*.jar plugins/*Slime*.jar; do [ -f "$j" ] && unzip -l "$j" | grep -E "/SlimefunItem.class|/BlockStorage.class|implementation/Slimefun.class" | head -4; done
          CP=$(find cache libraries -name '*.jar' | tr '\n' ':')$(ls plugins/*.jar | tr '\n' ':')
          echo "== javac:"; mkdir -p /tmp/sm && javac -proc:none -Xmaxerrs 6 -cp "$CP" -d /tmp/sm ../tools/compat-smoke/src/HybridCompatSmoke.java 2>&1 | head -24; echo "javac exit=${PIPESTATUS[0]}"
      - name: Errores en logs
        if: always()
        run: grep -h -E "ERROR|SEVERE|Exception" smoke1.log smoke2.log 2>/dev/null | cut -c1-200 | sort | uniq -c | sort -rn | head -15
