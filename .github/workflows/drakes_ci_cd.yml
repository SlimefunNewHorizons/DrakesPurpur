name: DrakesPurpur CI/CD & Auto-Deploy

on:
  push:
    branches:
      - "ver/**"
      - "main"
      - "master"
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.commits[0].message, '[ci-skip]')"
    steps:
      - name: Checkout DrakesPurpur
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure Git Author
        run: |
          git config --global user.email "pablo.elias.miranda.292003@gmail.com"
          git config --global user.name "JackStar6677-1"

      - name: Apply Paper & Purpur Patches
        run: ./gradlew applyAllPatches --stacktrace

      - name: Build Paperclip Server JAR
        run: ./gradlew createReobfPaperclipJar --stacktrace

      - name: Archive Production JAR
        uses: actions/upload-artifact@v4
        with:
          name: DrakesPurpur-26.2-server
          path: build/libs/*paperclip*.jar
          retention-days: 14

      - name: Notify SAORI Orchestrator (Webhook)
        if: success()
        env:
          SAORI_SECRET: ${{ secrets.SAORI_WEBHOOK_SECRET }}
        run: |
          echo "Build completed successfully. Ready for Saori ingest."
