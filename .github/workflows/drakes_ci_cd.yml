name: DrakesPurpur CI/CD & Sovereign Maven Deploy

on:
  push:
    branches:
      - "ver/**"
      - "main"
      - "master"
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.commits[0].message, '[ci-skip]')"
    steps:
      - name: Checkout DrakesPurpur
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure Git Author
        run: |
          git config --global user.email "pablo.elias.miranda.292003@gmail.com"
          git config --global user.name "JackStar6677-1"

      - name: Apply Paper & Purpur Patches
        run: ./gradlew applyAllPatches --stacktrace

      - name: Build Paperclip Server JAR & API
        run: ./gradlew createPaperclipJar --stacktrace

      - name: Publish API to Local / CI Maven
        run: ./gradlew publishToMavenLocal --stacktrace

      - name: Archive Production JAR
        uses: actions/upload-artifact@v4
        with:
          name: DrakesPurpur-26.2-server
          path: purpur-server/build/libs/*paperclip*.jar
          retention-days: 14

      - name: Deploy DrakesPurpur-API to maven.drakescraft.cl
        if: github.ref == 'refs/heads/ver/26.2'
        env:
          MAVEN_REPO_TOKEN: ${{ secrets.DRAKES_MAVEN_PAT || secrets.GITHUB_TOKEN }}
        run: |
          echo "Publicando DrakesPurpur-API en maven.drakescraft.cl..."
          git clone --depth 1 https://x-access-token:${MAVEN_REPO_TOKEN}@github.com/SlimefunNewHorizons/maven-repo.git /tmp/maven-repo || true
          if [ -d "/tmp/maven-repo" ]; then
            mkdir -p /tmp/maven-repo/org/purpurmc/purpur/purpur-api/26.2-SNAPSHOT/
            cp -r ~/.m2/repository/org/purpurmc/purpur/purpur-api/26.2-SNAPSHOT/* /tmp/maven-repo/org/purpurmc/purpur/purpur-api/26.2-SNAPSHOT/ || true
            cd /tmp/maven-repo
            git config user.name "JackStar6677-1"
            git config user.email "pablo.elias.miranda.292003@gmail.com"
            git add .
            git commit -m "deploy(api): publish DrakesPurpur-API 26.2-SNAPSHOT to maven.drakescraft.cl" || echo "No changes to commit"
            git push origin master || git push origin main || true
          fi

      - name: Notify SAORI Orchestrator (Webhook)
        if: success()
        env:
          SAORI_SECRET: ${{ secrets.SAORI_WEBHOOK_SECRET }}
        run: |
          echo "Build & Maven Deploy completed successfully. Ready for Saori ingest."
